
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Final Fix</title>
    <style>
        :root {
            --case-bg: #1a1a1a;
        }

        body {
            margin: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            /* 改为深灰网格，防止和黑色卡片混淆 */
            background-color: #222;
            background-image: 
                linear-gradient(#333 1px, transparent 1px),
                linear-gradient(90deg, #333 1px, transparent 1px);
            background-size: 40px 40px;
            font-family: monospace; overflow: hidden;
            perspective: 1500px;
        }

        .card-wrapper {
            /* 悬浮动画 */
            animation: float 6s ease-in-out infinite;
        }

        /* === 1. 实体光碟盒 (容器) === */
        .disc-case {
            position: relative;
            width: 360px; height: 540px;
            background: var(--case-bg);
            border-radius: 12px;
            
            /* 物理厚度阴影 (CSS 模拟，不涉及 3D 位移) */
            box-shadow: 
                /* 外部投影 */
                0 30px 60px rgba(0,0,0,0.6),
                /* 右下侧边厚度 */
                6px 6px 0px #0a0a0a,
                /* 顶部棱角高光 */
                inset 1px 1px 0px rgba(255,255,255,0.2),
                /* 底部反光 */
                inset -1px -1px 0px rgba(0,0,0,0.5);
                
            /* 边框厚度 */
            padding: 12px; 
            
            display: flex; justify-content: center; align-items: center;
            transform-style: preserve-3d;
            transition: transform 0.05s linear;
        }

        /* === 2. 封面区域 (绝对不使用 Z 轴位移) === */
        .cover-area {
            position: relative;
            width: 100%; height: 100%;
            border-radius: 6px;
            overflow: hidden;
            background: #ff00ff; /* 【调试色】如果看到品红色，说明图片没加载 */
            
            /* 内阴影模拟凹陷，代替物理位移 */
            box-shadow: 
                inset 3px 3px 8px rgba(0,0,0,0.8),
                inset -1px -1px 2px rgba(255,255,255,0.1);
            
            z-index: 5; /* 确保在盒子上层 */
        }

        /* === 3. 图片本体 === */
        .card-image {
            width: 100%; height: 100%; object-fit: cover;
            display: block;
            position: relative;
            z-index: 1; /* 确保显示 */
        }

        /* === 4. 特效层 (叠加在图片上) === */
        .holo-foil {
            position: absolute; inset: 0; pointer-events: none; z-index: 10;
            background: linear-gradient(135deg, transparent 30%, rgba(255,0,0,0.2) 45%, rgba(0,255,255,0.2) 55%, transparent 70%);
            background-size: 250% 250%;
            background-position: var(--pos-x, 50%) var(--pos-y, 50%);
            mix-blend-mode: color-dodge;
        }

        .plastic-glare {
            position: absolute; inset: 0; pointer-events: none; z-index: 20;
            background: linear-gradient(115deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0) 100%);
            transform: translateX(var(--glare-x, -150%));
            mix-blend-mode: overlay;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotateX(0); }
            50% { transform: translateY(-10px) rotateX(2deg); }
        }

        .debug-info {
            position: fixed; bottom: 30px; 
            background: #000; color: #fff; padding: 5px 10px;
            font-size: 12px; border: 1px solid #fff;
        }
    </style>
</head>
<body>

    <div class="card-wrapper">
        <div class="disc-case" id="card">
            <div class="cover-area">
                <img src="./final_cover.png" class="card-image" onerror="alert('图片加载失败，请检查文件名')">
                
                <div class="holo-foil"></div>
                <div class="plastic-glare"></div>
            </div>
        </div>
    </div>

    <div class="debug-info">
        DEBUG MODE: If MAGENTA -> Image Failed. If BLACK -> Rendering Issue.
    </div>

    <script>
        const card = document.getElementById('card');

        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const x = e.clientX - centerX;
            const y = e.clientY - centerY;

            // 物理倾斜
            const rotateX = -y / 15; 
            const rotateY = x / 15;
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;

            // 光影计算
            const percentX = (e.clientX / window.innerWidth) * 100;
            const percentY = (e.clientY / window.innerHeight) * 100;
            
            card.style.setProperty('--pos-x', `${percentX}%`);
            card.style.setProperty('--pos-y', `${percentY}%`);
            
            // 扫光计算
            const glarePos = ((e.clientX - rect.left) / rect.width) * 100; 
            card.style.setProperty('--glare-x', `${glarePos - 50}%`);
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0) rotateY(0) scale(1)';
        });
    </script>
</body>
</html>
