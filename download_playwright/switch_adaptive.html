
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Switch Adaptive Case</title>
    <style>
        :root {
            /* Switch 盒子材质 */
            --plastic-color: rgba(245, 245, 255, 0.15);
            --border-highlight: rgba(255, 255, 255, 0.4);
            --border-shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            margin: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background-color: #0f0f10;
            background-image: 
                radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%);
            perspective: 1500px; 
            overflow: hidden;
        }

        .scene { position: relative; }

        /* === 1. 物理外壳 (通用基础) === */
        .case-shell {
            position: relative;
            /* 默认竖版尺寸 (标准 Switch 盒) */
            width: 330px; height: 530px; 
            
            background: var(--plastic-color);
            backdrop-filter: blur(5px);
            
            /* 默认圆角：左侧硬，右侧圆 */
            border-radius: 2px 12px 12px 2px;
            
            border-top: 1px solid var(--border-highlight);
            border-bottom: 1px solid var(--border-shadow);
            border-right: 1px solid var(--border-shadow);
            border-left: none;

            /* 默认 Padding：左侧 0 (脊部包裹)，右侧 10px (开口) */
            padding: 8px 10px 8px 0; 
            box-sizing: border-box;

            box-shadow: 
                0 30px 60px rgba(0,0,0,0.6),
                inset -2px -2px 4px rgba(0,0,0,0.2),
                inset 1px 1px 2px rgba(255,255,255,0.3);
            
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1); /* 添加变形动画 */
            transform-style: preserve-3d;
        }

        /* === [变体] 横版限定盒 (Horizontal Variant) === */
        .case-shell.horizontal {
            /* 尺寸翻转，模拟横版礼盒 */
            width: 530px; height: 330px;
            
            /* 调整圆角逻辑：依然假设左侧是脊部（像书横放），或者根据审美调整 */
            /* 这里保持左侧硬边（脊部），右侧圆润（开口） */
            border-radius: 2px 12px 12px 2px; 
            
            /* Padding 保持不变，因为结构没变，只是变宽了 */
            padding: 8px 10px 8px 0; 
        }

        /* === 2. 脊部包裹模拟 (左侧阴影) === */
        .spine-wrap-shadow {
            position: absolute; left: 0; top: 0; bottom: 0;
            width: 25px; 
            z-index: 20; pointer-events: none;
            background: linear-gradient(to right, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.2) 15%, rgba(0,0,0,0) 100%);
        }
        
        .spine-highlight {
            position: absolute; left: 0; top: 0; bottom: 0;
            width: 2px;
            background: rgba(255,255,255,0.4);
            z-index: 25;
            box-shadow: 1px 0 2px rgba(0,0,0,0.5);
        }

        /* === 3. 纸张层 === */
        .paper-layer {
            position: relative;
            width: 100%; height: 100%;
            background: #e0e0e0;
            overflow: hidden;
            border-radius: 0 4px 4px 0;
            filter: contrast(0.95) brightness(0.95);
        }

        .cover-img {
            width: 100%; height: 100%;
            object-fit: cover; /* 关键：无论盒子怎么变，图片都填满 */
            display: block;
        }

        /* === 4. 塑料光效 === */
        .plastic-sheen {
            position: absolute; inset: 0;
            z-index: 30; pointer-events: none;
            border-radius: inherit; /* 跟随盒子圆角 */
            background: 
                linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 20%),
                linear-gradient(to bottom, rgba(255,255,255,0.02), transparent);
        }

        .light-glare {
            position: absolute; inset: 0;
            z-index: 31; pointer-events: none;
            border-radius: inherit;
            background: linear-gradient(110deg, transparent 40%, rgba(255,255,255,0.3) 45%, rgba(255,255,255,0.1) 50%, transparent 60%);
            transform: translateX(var(--glare-x, -150%));
            mix-blend-mode: soft-light;
        }

        .debug {
            position: fixed; bottom: 20px; color: #666; font-family: sans-serif; font-size: 12px;
            text-align: center; width: 100%;
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="case-shell" id="card">
            <div class="spine-highlight"></div>
            <div class="spine-wrap-shadow"></div>

            <div class="paper-layer">
                <img src="./switch_adaptive.jpg" class="cover-img" id="coverImage">
            </div>

            <div class="plastic-sheen"></div>
            <div class="light-glare"></div>
        </div>
    </div>

    <div class="debug" id="debugText">正在分析图片比例...</div>

    <script>
        const card = document.getElementById('card');
        const img = document.getElementById('coverImage');
        const debugText = document.getElementById('debugText');

        // === 自动适配逻辑 ===
        img.onload = function() {
            const w = this.naturalWidth;
            const h = this.naturalHeight;
            const ratio = w / h;

            if (w > h) {
                // 如果是横图，添加 horizontal 类
                card.classList.add('horizontal');
                debugText.innerHTML = `检测到横版图片 (${w}x${h}) <br> 已切换至【横版限定礼盒】模式`;
            } else {
                // 默认竖版
                debugText.innerHTML = `检测到竖版图片 (${w}x${h}) <br> 已应用【标准 Switch 卡盒】模式`;
            }
        };

        // 交互动画
        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const x = e.clientX - centerX;
            const y = e.clientY - centerY;

            // 物理旋转
            const rotateX = -y / 25; 
            const rotateY = x / 25;
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

            // 光影位置
            const glarePos = ((e.clientX - rect.left) / rect.width) * 100; 
            card.style.setProperty('--glare-x', `${glarePos - 50}%`);
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0) rotateY(0)';
        });
    </script>
</body>
</html>
