// 功能：提取商品 ID(数字型)、名称、价格、销量
// 运行环境：浏览器 F12 控制台

(function() {
    const goodsElements = document.querySelectorAll('.HhHzdddL[data-ranking-goods-id]');
    
    if (goodsElements.length === 0) {
        console.log("%c未找到商品信息，请检查页面结构。", "color: red;");
        return;
    }

    const results = Array.from(goodsElements).map((el) => {
        // 1. 提取 ID 并转换为数字类型（去掉引号）
        const rawId = el.getAttribute('data-ranking-goods-id');
        const goodsId = rawId ? Number(rawId) : 0;

        // 2. 提取名称
        const titleEl = el.querySelector('.aSK0xqsx') || el.querySelector('.h7UWKNWJ');
        const title = titleEl ? titleEl.innerText.trim() : "未知商品";

        // 3. 提取价格 (通过正则提取数字)
        const priceEl = el.querySelector('.jl7gHbm2');
        const price = priceEl ? parseFloat(priceEl.innerText.replace(/[^\d.]/g, '')) : 0;

        // 4. 提取销量 (优先取总售，次选热销)
        const salesEl = el.querySelector('.nCIMty6I') || el.querySelector('.uatCrLvM') || el.querySelector('.Xd6T6W4f');
        const sales = salesEl ? salesEl.innerText.trim() : "无数据";

        return {
            "商品ID": goodsId, // 数字类型在 table 中不带引号
            "商品名称": title,
            "价格": price,
            "销量信息": sales
        };
    });

    // 表格化打印
    console.table(results);
    
    console.log(`%c成功提取 ${results.length} 条数据。`, "color: #4caf50; font-weight: bold;");
})();