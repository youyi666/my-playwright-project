// 功能：最终精准版 - 解决价格分离导致的 0 问题
// 运行环境：浏览器 F12 控制台

(function() {
    const goodsElements = document.querySelectorAll('div[data-ranking-goods-id]');
    
    if (goodsElements.length === 0) {
        console.log("%c未找到商品，请检查页面。", "color: red;");
        return;
    }

    const results = Array.from(goodsElements).map((el) => {
        const goodsId = el.getAttribute('data-ranking-goods-id');
        const titleEl = el.querySelector('div[title]');
        const title = titleEl ? titleEl.getAttribute('title') : "未知名称";

        // --- 【价格修复逻辑】 ---
        // 1. 先定位那个写着 "￥" 的符号节点
        const symbolNode = Array.from(el.querySelectorAll('*')).find(node => 
            node.children.length === 0 && node.innerText.trim() === '￥'
        );
        
        let price = 0;
        if (symbolNode) {
            // 2. 核心：取符号节点的【父元素】的文本，这样能同时拿到符号和后面的数字
            const priceText = symbolNode.parentElement.innerText;
            // 3. 正则匹配：只提取跟在 ￥ 后面或者在该容器内的数字（含小数点）
            const match = priceText.match(/\d+(\.\d+)?/);
            price = match ? parseFloat(match[0]) : 0;
        }

        // --- 【销量修复逻辑】 ---
        const allTextNodes = Array.from(el.querySelectorAll('div, span'));
        const salesNode = allTextNodes.reverse().find(node => 
            (node.innerText.includes('售') || node.innerText.includes('件')) && 
            !node.innerText.includes('热卖指数')
        );
        
        let sales = "无数据";
        if (salesNode) {
            const match = salesNode.innerText.match(/(总售|已抢|热销)[\d.+万]+件/);
            sales = match ? match[0] : salesNode.innerText.split('\n').pop();
        }

        return {
            "商品ID": goodsId,
            "商品名称": title,
            "价格": price,
            "销量信息": sales.trim()
        };
    });

    console.table(results);
})();