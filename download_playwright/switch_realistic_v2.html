
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Switch Realistic Case</title>
    <style>
        :root {
            /* Switch 盒子：半透明的高密度聚乙烯，稍微带点冷白 */
            --plastic-color: rgba(245, 245, 255, 0.15);
            --border-highlight: rgba(255, 255, 255, 0.4);
            --border-shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            margin: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background-color: #0f0f10;
            background-image: 
                radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%);
            perspective: 1500px; /* 增加透视距离，减少畸变，更像产品摄影 */
            overflow: hidden;
        }

        .scene {
            /* 舞台容器 */
            position: relative;
        }

        /* === 1. 物理外壳 (The Plastic Shell) === */
        .case-shell {
            position: relative;
            width: 330px; height: 530px; /* 修正后的比例 */
            
            /* 材质基础 */
            background: var(--plastic-color);
            backdrop-filter: blur(5px); /* 磨砂感，让下面的纸看起来像隔着东西 */
            
            /* 轮廓：左侧硬直(脊部)，右侧圆润 */
            border-radius: 2px 12px 12px 2px;
            
            /* 物理厚度边框 */
            border-top: 1px solid var(--border-highlight);
            border-bottom: 1px solid var(--border-shadow);
            border-right: 1px solid var(--border-shadow);
            border-left: none; /* 左侧不画线，用光影模拟 */

            /* 核心布局：缩小边距 */
            /* 上下 8px，右侧 10px (开口处)，左侧 0 (包裹) */
            padding: 8px 10px 8px 0; 
            box-sizing: border-box;

            /* 整体投影 */
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.6), /* 环境光 */
                inset -2px -2px 4px rgba(0,0,0,0.2), /* 塑料内倒角阴影 */
                inset 1px 1px 2px rgba(255,255,255,0.3); /* 塑料内高光 */
            
            transition: transform 0.1s linear;
            transform-style: preserve-3d;
        }

        /* === 2. 脊部包裹模拟 (The Spine Wrap) === */
        /* 这是一个位于最左侧的独立光影层，模拟纸张转弯 */
        .spine-wrap-shadow {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 25px; /* 影响范围 */
            z-index: 20; /* 在纸张之上，塑料之下 */
            pointer-events: none;
            
            /* 核心视错觉：从深色(弯曲处)到透明 */
            background: linear-gradient(to right, 
                rgba(0,0,0,0.6) 0%,   /* 最左边缘深色 */
                rgba(0,0,0,0.2) 15%, 
                rgba(0,0,0,0) 100%);
        }
        
        /* 脊部的高光棱角 (塑料壳的转折点) */
        .spine-highlight {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: rgba(255,255,255,0.4);
            z-index: 25;
            box-shadow: 1px 0 2px rgba(0,0,0,0.5);
        }

        /* === 3. 纸张层 (The Paper Insert) === */
        .paper-layer {
            position: relative;
            width: 100%; height: 100%;
            background: #e0e0e0;
            overflow: hidden;
            
            /* 纸张只有右边有圆角，左边是直的（被夹进去的） */
            border-radius: 0 4px 4px 0;
            
            /* 纸张微弱的纹理，避免像屏幕发光 */
            filter: contrast(0.95) brightness(0.95);
        }

        .cover-img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        /* === 4. 塑料薄膜反光层 (The Plastic Sheen) === */
        /* 这是 Switch 盒子最明显的特征：一层有点松动的透明薄膜 */
        .plastic-sheen {
            position: absolute; inset: 0;
            z-index: 30; pointer-events: none;
            border-radius: 2px 12px 12px 2px;
            
            /* 静态环境反光 - 模拟稍微有点不平整的塑料膜 */
            background: 
                /* 左上角强光 */
                linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 20%),
                /* 整体微弱漫反射 */
                linear-gradient(to bottom, rgba(255,255,255,0.02), transparent);
                
            /* 噪点纹理，增加真实物质感 (Optional) */
            /* box-shadow: inset 0 0 20px rgba(0,0,0,0.1); */
        }

        /* 动态扫光条 */
        .light-glare {
            position: absolute; inset: 0;
            z-index: 31; pointer-events: none;
            border-radius: 2px 12px 12px 2px;
            
            background: linear-gradient(110deg, 
                transparent 40%, 
                rgba(255,255,255,0.3) 45%, /* 高光条 */
                rgba(255,255,255,0.1) 50%, 
                transparent 60%);
            
            transform: translateX(var(--glare-x, -150%));
            mix-blend-mode: soft-light; /* 柔光混合，更像塑料反光 */
        }

        .debug {
            position: fixed; bottom: 20px; color: #444; font-family: sans-serif; font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="case-shell" id="card">
            <div class="spine-highlight"></div>
            <div class="spine-wrap-shadow"></div>

            <div class="paper-layer">
                <img src="./switch_cover_v2.png" class="cover-img">
            </div>

            <div class="plastic-sheen"></div>
            <div class="light-glare"></div>
        </div>
    </div>

    <div class="debug">移动鼠标体验 3D 光影 / High-Fidelity Switch Case</div>

    <script>
        const card = document.getElementById('card');

        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const x = e.clientX - centerX;
            const y = e.clientY - centerY;

            // 1. 细微的物理旋转 (Switch 盒子很轻，不需要太夸张的角度)
            const rotateX = -y / 25; 
            const rotateY = x / 25;
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

            // 2. 光影位置计算
            const glarePos = ((e.clientX - rect.left) / rect.width) * 100; 
            card.style.setProperty('--glare-x', `${glarePos - 50}%`);
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0) rotateY(0)';
        });
    </script>
</body>
</html>
